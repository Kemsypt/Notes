003cspan>Indent / outdent a list item\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Alt\u003c/kbd> + \u003ckbd>1–6 / 0\u003c/kbd>\u003c/span>\u003cspan>Heading 1–6 / normal text\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Shift\u003c/kbd> + \u003ckbd>X\u003c/kbd>\u003c/span>\u003cspan>Strikethrough\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Space\u003c/kbd>\u003c/span>\u003cspan>Clear inline formatting\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Z / Y\u003c/kbd>\u003c/span>\u003cspan>Undo / redo note edits, including images\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>F\u003c/kbd>\u003c/span>\u003cspan>Find in this note · Enter / Shift+Enter next / previous\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>N\u003c/kbd>\u003c/span>\u003cspan>New note · add Alt for a subnote\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Page Up / Down\u003c/kbd>\u003c/span>\u003cspan>Previous / next note\u003c/span>\u003cspan>\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Shift\u003c/kbd> + \u003ckbd>V\u003c/kbd>\u003c/span>\u003cspan>Paste plain text\u003c/span>\u003cspan>\u003ckbd>Shift\u003c/kbd> + \u003ckbd>Enter\u003c/kbd>\u003c/span>\u003cspan>Line break without a new paragraph\u003c/span>\u003cspan>\u003ckbd>F2\u003c/kbd> twice\u003c/span>\u003cspan>Insert date, then date + time\u003c/span>\u003c/div>\u003cp class=\"muted\">\u003cstrong>Tables:\u003c/strong> use Table or Ctrl+Alt+T. Click a cell and type, or double-click / F2 to edit. Enter / Tab move between cells; Shift reverses direction. Shift-click or Shift+arrows selects a range. Copy/paste Excel ranges, use the formula bar, and drag column or row edges to resize. Double-click an edge to auto-fit. Right-click cells for insertion, deletion and sizing actions. Formulas: SUM, AVERAGE, MIN, MAX, COUNT, IF, ROUND, ABS, AND, OR, NOT; arithmetic, comparisons and references such as =A1+B1 or =SUM(A1:A10). While editing a formula, Ctrl-click cells to insert references, Ctrl-drag for ranges and Ctrl+Shift-click to extend a range. F4 cycles absolute references. Formulas stay in backups; OneNote receives the table and calculated values.\u003c/p>\u003cp class=\"muted\">Start a paragraph with \u003cstrong>-\u003c/strong>, \u003cstrong>*\u003c/strong> or \u003cstrong>1.\u003c/strong> then Space for a list. Use \u003cstrong>#\u003c/strong> through \u003cstrong>######\u003c/strong> then Space for a heading. Enter at the end of a heading returns to normal text. Enter twice finishes a list.\u003c/p>\u003cp class=\"muted\">Use Ctrl+K to insert a link, with or without selected text. Click an image for corner handles. Drag a corner to resize with its aspect ratio locked; Esc cancels the drag. Delete removes a selected image. Double-click to view it larger. Paste screenshots or drag PNG/JPEG files into your note.\u003c/p>\u003cp class=\"muted\">Drag a sidebar divider to change its width; double-click to reset. Collapse subnotes using the arrow beside the note. Double-click a note in the list, or press F2 there, to rename it. On Mac, use Command in place of Ctrl for editing shortcuts.\u003c/p>\u003c/dialog>\u003cdialog id=\"caseDialog\">\u003cform id=\"caseForm\" novalidate>\u003cdiv class=\"dialog-heading\">\u003ch2 id=\"caseDialogTitle\">New case\u003c/h2>\u003cbutton type=\"button\" id=\"randomCaseBtn\" title=\"Fill with sensible sample data\" aria-label=\"Fill case with sample data\">🎲\u003c/button>\u003c/div>\u003cdiv class=\"formgrid\">\u003clabel class=\"wide\" id=\"existingCaseLabel\">Case\u003cselect id=\"existingCaseSelect\">\u003coption value=\"\">Create a new case\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"wide\">Title\u003cinput name=\"title\" required maxlength=\"180\">\u003c/label>\u003clabel>Client name\u003cinput name=\"clientName\">\u003c/label>\u003clabel>Case ID\u003cinput name=\"clientId\">\u003c/label>\u003clabel hidden>Type of case\u003cselect name=\"caseType\">\u003c/select>\u003c/label>\u003clabel>Case due date\u003cinput name=\"dueDate\" type=\"date\" required>\u003c/label>\u003clabel hidden>Days before due date\u003coutput id=\"daysOutput\" style=\"padding:9px;background:#f4f6f8;border-radius:7px\">\u003c/output>\u003c/label>\u003clabel hidden>Category\u003cselect name=\"category\">\u003c/select>\u003c/label>\u003clabel class=\"wide\">Actions\u003ctextarea name=\"actions\">\u003c/textarea>\u003c/label>\u003clabel class=\"wide\">Comments\u003ctextarea name=\"comments\">\u003c/textarea>\u003c/label>\u003clabel>Status\u003cselect name=\"status\" id=\"caseStatus\">\u003c/select>\u003c/label>\u003c/div>\u003cp id=\"caseSaveError\" role=\"alert\" class=\"save-error\" hidden>\u003c/p>\u003cdiv class=\"footer\">\u003cbutton type=\"button\" id=\"deleteCaseBtn\" class=\"danger\">Delete case\u003c/button>\u003cspan class=\"spacer\">\u003c/span>\u003cbutton type=\"button\" id=\"cancelCaseBtn\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">Save case\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"settingsDialog\">\u003cform id=\"settingsForm\">\u003ch2>Workspace settings\u003c/h2>\u003cdiv class=\"formgrid\">\u003clabel>Workday starts\u003cinput name=\"start\" type=\"time\" required>\u003c/label>\u003clabel>Number of hourly slots\u003cinput name=\"hours\" type=\"number\" min=\"1\" max=\"16\" required>\u003c/label>\u003clabel>Calendar day height (%)\u003cinput name=\"calendarHeight\" id=\"calendarHeight\" type=\"number\" min=\"50\" max=\"150\" step=\"5\" required>\u003c/label>\u003c/div>\u003ch3 hidden>Case types\u003c/h3>\u003clabel hidden class=\"settings-label\">One option per line\u003ctextarea id=\"caseTypesSetting\" rows=\"6\" style=\"width:100%\">\u003c/textarea>\u003c/label>\u003ch3>Case statuses\u003c/h3>\u003cdiv id=\"statusSettings\">\u003c/div>\u003cbutton type=\"button\" id=\"addStatusBtn\">+ Add status\u003c/button>\u003cdiv id=\"legacyColourCategories\" hidden>\u003ch3>Colour categories\u003c/h3>\u003cdiv id=\"categorySettings\">\u003c/div>\u003cbutton type=\"button\" id=\"addCategoryBtn\">+ Add category\u003c/button>\u003c/div>\u003ch3>Saving\u003c/h3>\u003ch3>Workspace backup\u003c/h3>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"linkJsonBtn\">Choose backup…\u003c/button>\u003cbutton type=\"button\" id=\"disconnectJsonBtn\">Disconnect backup\u003c/button>\u003c/div>\u003cp id=\"jsonStatus\" class=\"status\">No backup file linked.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"backupBtn\">Export backup\u003c/button>\u003cbutton type=\"button\" id=\"restoreBtn\">Import backup\u003c/button>\u003c/div>\u003cdiv class=\"footer\">\u003cspan class=\"spacer\">\u003c/span>\u003cbutton type=\"button\" id=\"cancelSettingsBtn\">Cancel\u003c/button>\u003cbutton class=\"primary\" type=\"submit\">Apply settings\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"conflictDialog\">\u003ch2>Linked file changed outside Casebook\u003c/h2>\u003cp id=\"conflictMessage\" class=\"muted\">\u003c/p>\u003cp>Your local work is kept. Choose which version to use.\u003c/p>\u003cdiv class=\"footer\">\u003cbutton id=\"keepConflictBtn\">Keep paused\u003c/button>\u003cbutton id=\"reloadConflictBtn\">Reload file\u003c/button>\u003cbutton id=\"overwriteConflictBtn\" class=\"danger\">Replace file with local copy\u003c/button>\u003c/div>\u003c/dialog>\n\u003cinput id=\"restoreFile\" type=\"file\" accept=\".json\" hidden>\u003cdiv id=\"toast\" class=\"toast hidden\" role=\"status\">\u003c/div>\n\u003cdialog id=\"oneSyncConflictDialog\">\u003ch2>OneNote sync needs a choice\u003c/h2>\u003cp id=\"oneSyncConflictMessage\">\u003c/p>\u003cdiv class=\"footer\">\u003cbutton type=\"button\" id=\"oneSyncKeepPaused\">Keep paused\u003c/button>\u003cbutton type=\"button\" id=\"oneSyncUseRemote\">Use OneNote\u003c/button>\u003cbutton type=\"button\" id=\"oneSyncUseLocal\" class=\"danger\">Use Casebook\u003c/button>\u003c/div>\u003c/dialog>\u003cinput id=\"oneImportFile\" type=\"file\" accept=\".one\" hidden>\u003cdialog id=\"oneImportDialog\">\u003ch2>Import OneNote section\u003c/h2>\u003cp id=\"oneImportSummary\" class=\"muted\">\u003c/p>\u003cp id=\"oneImportDuplicates\" class=\"status\">\u003c/p>\u003cdiv id=\"oneImportWarnings\" class=\"notice hidden\">\u003c/div>\u003cdiv id=\"oneImportPreview\" style=\"max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px\">\u003c/div>\u003cdiv class=\"footer\">\u003cbutton id=\"cancelOneImportBtn\" type=\"button\">Cancel\u003c/button>\u003cbutton id=\"confirmOneImportBtn\" type=\"button\" class=\"primary\">Import as new case\u003c/button>\u003c/div>\u003c/dialog>\u003cdiv id=\"textColourPalette\" class=\"colour-palette hidden\" role=\"dialog\" aria-label=\"Text colours\">\u003cdiv id=\"baseColourGrid\" class=\"base-colour-grid\">\u003c/div>\u003cbutton id=\"customTextColourBtn\" type=\"button\">Custom colour…\u003c/button>\u003c/div>\n\u003cdialog id=\"customColourDialog\">\u003cform id=\"customColourForm\">\u003ch2>Custom colour\u003c/h2>\u003cdiv class=\"custom-colour-row\">\u003cinput id=\"customTextColour\" type=\"color\" value=\"#b3261e\" aria-label=\"Custom colour picker\">\u003clabel>Hex colour\u003cinput id=\"customColourHex\" value=\"#b3261e\" maxlength=\"40\" autocomplete=\"off\" spellcheck=\"false\" required>\u003c/label>\u003cstrong id=\"customColourPreview\" style=\"color:#b3261e\" aria-hidden=\"true\">Aa\u003c/strong>\u003c/div>\u003cdiv class=\"footer\">\u003cbutton id=\"customColourCancel\" type=\"button\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">Apply\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"newCaseDialog\">\u003cform id=\"newCaseForm\">\u003ch2>New case\u003c/h2>\u003clabel class=\"new-case-label\">Client name\u003cinput id=\"newCaseClient\" type=\"text\" autocomplete=\"off\">\u003c/label>\u003clabel class=\"new-case-label\">Case ID\u003cinput id=\"newCaseBusinessId\" type=\"text\" autocomplete=\"off\">\u003c/label>\u003clabel class=\"new-case-label\">Case title\u003cinput id=\"newCaseName\" type=\"text\" maxlength=\"1024\" autocomplete=\"off\" autofocus>\u003c/label>\u003cdiv class=\"footer\">\u003cbutton id=\"cancelNewCaseBtn\" type=\"button\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">Create case\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\u003cscript>\n/* Embedded raster images only: no remote URLs, SVG or executable markup. */\nfunction CasebookImageCodecFactory(){\n const MAX_IMAGE=1024*1024,MAX_TOTAL=2*1024*1024,imageCache=new Map();\n function inspect(bytes){\n  const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);let mime='',width=0,height=0;\n  if(bytes.length>=33&&[137,80,78,71,13,10,26,10].every((b,i)=>bytes[i]===b)&&v.getUint32(8)===13&&v.getUint32(12)===0x49484452){mime='image/png';width=v.getUint32(16);height=v.getUint32(20);}\n  else if(bytes.length>=4&&bytes[0]===255&&bytes[1]===216){mime='image/jpeg';let p=2;while(p+4\u003c=bytes.length){if(bytes[p++]!==255)break;while(bytes[p]===255)p++;const marker=bytes[p++];if(marker===217||marker===218)break;if(marker===1||(marker>=208&&marker\u003c=215))continue;if(p+2>bytes.length)break;const length=v.getUint16(p);if(length\u003c2||p+length>bytes.length)break;if([192,193,194,195,197,198,199,201,202,203,205,206,207].includes(marker)&&length>=8){height=v.getUint16(p+3);width=v.getUint16(p+5);break;}p+=length;}}\n  if(!mime||!width||!height||width>16384||height>16384||width*height>40000000)throw Error('Choose a valid PNG or JPEG image up to 40 megapixels.');return {mime,width,height};\n }\n function decode(src){if(imageCache.has(src))return imageCache.get(src);if(typeof src!=='string'||src.length>MAX_IMAGE||!/^data:image\\/(png|jpeg);base64,[A-Za-z0-9+/]+={0,2}$/.test(src))throw Error('Image must be an embedded PNG/JPEG under 1 MB.');const comma=src.indexOf(','),raw=atob(src.slice(comma+1)),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),info=inspect(bytes);if(!src.startsWith('data:'+info.mime+';'))throw Error('Image type does not match its data.');const result={bytes,...info};imageCache.set(src,result);if(imageCache.size>12)imageCache.delete(imageCache.keys().next().value);return result;}\n function encode(bytes){const info=inspect(bytes);let text='';for(let i=0;i\u003cbytes.length;i+=16384)text+=String.fromCharCode(...bytes.subarray(i,i+16384));const src='data:'+info.mime+';base64,'+btoa(text);if(src.length>MAX_IMAGE)throw Error('Image exceeds the 1 MB embedded image limit.');return {src,...info};}\n function normalise(image){if(!image||typeof image!=='object')throw Error('Invalid image.');const info=decode(image.src),width=Number.isFinite(image.width)?Math.round(image.width):Math.min(info.width,720),height=Number.isFinite(image.height)?Math.round(image.height):Math.max(1,Math.round(width*info.height/info.width));if(width\u003c1||width>4096||height\u003c1||height>16384)throw Error('Invalid image display size.');return {src:image.src,alt:String(image.alt||'Image').slice(0,500),width,height,...(image.mode==='freeplace'?{mode:'freeplace',x:Math.round(Math.max(0,Math.min(20000,Number(image.x)||0))),y:Math.round(Math.max(0,Math.min(50000,Number(image.y)||0)))}:{})};}\n return {inspect,decode,encode,normalise,MAX_IMAGE,MAX_TOTAL};\n}\nconst CasebookImages=CasebookImageCodecFactory();\nif(typeof module!=='undefined'&&module.exports)module.exports=CasebookImages;\n\n/* Casebook lightweight tables. Formula syntax is parsed as data; never evaluated as JavaScript. */\nfunction CasebookSheetsFactory(){\n const MAX_ROWS=200,MAX_COLS=26,formats=['general','number','currency','percent'],cache=new Map();\n const escape=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n const colName=n=>String.fromCharCode(65+n),address=(r,c)=>colName(c)+(r+1);\n function cell(input=''){const text=String(input),trim=text.trim();let format='general',value=text;if(/^-?\\$[\\d,]+(?:\\.\\d+)?$/.test(trim)){const number=Number(trim.replace(/[$,]/g,''));if(Number.isFinite(number)){format='currency';value=String(number);}}else if(/^[+-]?(?:\\d+\\.?\\d*|\\.\\d+)%$/.test(trim)){format='percent';value=String(Number(trim.slice(0,-1))/100);}else if(/^[+-]?\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?$/.test(trim)){format='number';value=String(Number(trim.replace(/,/g,'')));}return {input:value,format};}\n function normalise(table){\n  if(!table||table.version!==1||!Array.isArray(table.rows)||!table.rows.length||table.rows.length>MAX_ROWS||!Array.isArray(table.rows[0])||!table.rows[0].length||table.rows[0].length>MAX_COLS)throw Error('Tables support 1–200 rows and 1–26 columns.');\n  const columns=table.rows[0].length;let length=0;const rows=table.rows.map(row=>{if(!Array.isArray(row)||row.length!==columns)throw Error('Invalid table dimensions.');return row.map(c=>{if(!c||typeof c.input!=='string'||c.input.length>10000||(length+=c.input.length)>500000)throw Error('Table contents are too large.');const out={input:c.input,format:formats.includes(c.format)?c.format:'general'};for(const flag of ['bold','italic'])if(c[flag]===true)out[flag]=true;if(['left','center','right'].includes(c.align))out.align=c.align;return out;});});\n  const widths=Array.from({length:columns},(_,i)=>Math.max(64,Math.min(600,Math.round(Number(table.widths?.[i])||140))));const heights=rows.map((_,i)=>Math.max(30,Math.min(600,Math.round(Number(table.heights?.[i])||30))));return {version:1,rows,widths,heights,header:table.header===true};\n }\n const create=(rows=4,columns=3)=>normalise({version:1,rows:Array.from({length:rows},()=>Array.from({length:columns},()=>cell())),header:false});\n const fail=code=>{throw Error(code);};\n function tokenize(text){const tokens=[];let p=0;while(p\u003ctext.length){if(/\\s/.test(text[p])){p++;continue;}const part=text.slice(p);let m;\n   if((m=/^\"(?:[^\"]|\"\")*\"/.exec(part)))tokens.push({kind:'string',value:m[0].slice(1,-1). (--panel);\n      color:var(--text);\n      border:1px solid var(--border);\n    }\n    #settingsBtn{\n      width:42px;\n      padding:0;\n      font-size:18px;\n      line-height:1;\n    }\n\n    .status{ font-size:13px; color:var(--muted); }\n\n    .footer{\n      font-size:12px;\n      color:var(--muted);\n      text-align:center;\n      margin:18px 0 6px;\n    }\n    .footer a, .footer a:visited{ color:inherit; text-decoration: underline; }\n\n    /* Accessibility */\n    .srOnly{\n      position:absolute;\n      width:1px;\n      height:1px;\n      padding:0;\n      margin:-1px;\n      overflow:hidden;\n      clip:rect(0,0,0,0);\n      white-space:nowrap;\n      border:0;\n    }\n\n    /* Inbound/Outbound segmented control */\n    .seg{\n      display:flex;\n      border:1px solid var(--border-2);\n      border-radius:10px;\n      overflow:hidden;\n      background:var(--panel);\n      height:42px;\n    }\n    .segBtn{\n      flex:1;\n      background:transparent;\n      color:var(--text);\n      border:0;\n      border-right:1px solid var(--border-2);\n      padding:0 10px;\n      font-weight:900;\n      cursor:pointer;\n      font-size:14px;\n      height:42px;\n      display:flex;\n      align-items:center;\n      justify-content:center;\n    }\n    .segBtn:last-child{ border-right:0; }\n    .segBtn[aria-pressed=\"true\"]{\n      background:var(--accent);\n      color:var(--btn-text);\n    }\n\n    /* Date/time input with icon button */\n    .withIcon{\n      display:flex;\n      align-items:stretch;\n      gap:8px;\n    }\n    .withIcon input{ flex:1; }\n    .iconBtn{\n      width:42px;\n      height:42px;\n      display:grid;\n      place-items:center;\n      border-radius:10px;\n      border:1px solid var(--border-2);\n      background:var(--panel);\n      color:var(--text);\n      cursor:pointer;\n      padding:0;\n      flex:0 0 auto;\n    }\n    .iconBtn svg{ width:18px; height:18px; }\n\n    /* Multi-select dropdown (PORO) */\n    .ms{ position:relat mn}.modalBody{overflow:auto}.scriptText{line-height:1.65}.scriptText p:first-child{margin-top:0}.scriptText p:last-child{margin-bottom:0}.scriptText a{color:var(--accent)}.segBtn{font-size:13px;padding:0 6px}\n  \u003c/style>\n\u003cstyle>\n/* Casebook companion theme */\n:root{\n  --bg:#f2f5f7;--panel:#fff;--panel-2:#f8fafc;--text:#23354b;\n  --muted:#5d7084;--border:#dce4ec;--border-2:#ced8df;\n  --accent:#006b98;--btn-text:#fff;--soft:#e6f2f7;--brand:#153956;\n  --focus:#70b4a5;--shadow:0 6px 18px #142a3b0d;\n}\nbody[data-theme=\"dark\"]{\n  color-scheme:dark;--bg:#101d2a;--panel:#192a3b;--panel-2:#213447;\n  --text:#e3edf5;--muted:#a2b6c8;--border:#34465a;--border-2:#485e74;\n  --accent:#65bfe8;--btn-text:#142233;--soft:#203d51;--brand:#e3edf5;\n  --focus:#65bfe8;--shadow:0 6px 18px #00000020;\n}\nbody{font:14px Arial,system-ui,sans-serif}\n.wrap{max-width:1100px;margin:0 auto;padding:22px 24px 16px}\n.topbar{\n  padding:18px 24px;margin:0;background:var(--panel);\n  border-top:5px solid #153956;border-bottom:1px solid var(--border);\n  justify-content:flex-start;gap:12px;\n}\nbody[data-theme=\"dark\"] .topbar{border-top-color:#65bfe8}\nh1{font-size:21px;font-weight:750;letter-spacing:-.7px;color:var(--brand);line-height:1.3}\nh1 span{color:var(--accent)}\n.scriptButtons{margin-left:auto;gap:6px}\n.scriptButtons button,.themeToggle{font-family:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:6px 10px;height:32px}\n#themeToggle{margin-left:12px}\nfieldset{border-radius:12px;padding:18px 20px 20px;margin:12px 0 20px;background:var(--panel)}\nlegend{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:0 8px}\nlabel{font-size:12px;font-weight:600;gap:6px}\ninput,select,textarea{font:14px Arial,system-ui,sans-serif;border-radius:7px;padding:9px 11px}\ntextarea{line-height:1.6;font-weight:400;min-height:110px}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px}\nbutton{font-family:inherit;font-weight:600;border-radius:8px;border:1px solid var(--accent)}\nbutton.ghost,.themeToggle,.iconBtn,.msToggle{border-color:var(--border)}\nbutton:hover{filter:brightness(.97)}\nbutton.ghost:hover,.themeToggle:hover,.iconBtn:hover,.msToggle:hover{background:var(--soft);filter:none}\nbutton:focus-visible,.msOpt:focus-visible{outline:2px solid var(--accent);outline-offset:3px}\n.seg{border-radius:8px}\n.segBtn{font-weight:600;border-radius:0;border:0;border-right:1px solid var(--border-2)}\n.segBtn[aria-pressed=\"true\"]{background:var(--soft);color:var(--accent);box-shadow:inset 0 -2px var(--accent)}\n.msToggle{font-weight:600}\n.msOpt.selected,body[data-theme=\"dark\"] .msOpt.selected{background:var(--soft);color:var(--accent)}\n.msMenu{box-shadow:0 12px 32px #142a3b20}\ndetails{border-radius:12px;padding:14px 18px}\nsummary{font-size:13px;font-weight:600}\npre{line-height:1.6;color:var(--text)}\n.actions{padding-top:8px;bottom:12px}\n.bar{border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}\n.status{font-size:12px}\n.footer{margin-top:20px;font-size:11px}\n.modalOverlay{background:#1c2d405c}\n.modal{border-radius:14px;box-shadow:0 24px 80px #142a3b33}\n.modalHeader{background:var(--panel);padding:18px 20px}\n.modalHeader #settingsTitle,.modalHeader #scriptTitle{font-size:20px;font-weight:700!important;letter-spacing:-.3px}\n.modalBody{padding:20px}\n.scriptText{font-size:14px;line-height:1.7}\nbody[data-theme=\"dark\"] #copyBtn,body[data-theme=\"dark\"] #dtSave{background:#096b96;border-color:#096b96;color:#fff}\n@media(max-width:860px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:16px}.wrap{padding:16px}.topbar h1{flex:1 1 100%}.scriptButtons{margin-left:0}#themeToggle{margin-left:auto}}\n@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}fieldset{padding:14px}.topbar{gap:10px}.scriptButtons{gap:5px}.scriptButtons button,.themeToggle{padding:6px 9px}.modalBody{padding:16px}.wrap{padding:12px}.acti "button\" class=\"ghost\" data-script=\"email\">Email\u003c/button>\n        \u003cbutton type=\"button\" class=\"ghost\" data-script=\"recording\">Recording\u003c/button>\n        \u003cbutton type=\"button\" class=\"ghost\" data-script=\"privacy\">Privacy\u003c/button>\n        \u003cbutton type=\"button\" class=\"ghost\" data-script=\"voicemail\">Voicemail\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"headerTools\">\n        \u003cbutton type=\"button\" id=\"settingsBtn\" class=\"ghost\" aria-label=\"Settings\" title=\"Settings\">Settings\u003c/button>\n        \u003cbutton type=\"button\" id=\"themeToggle\" class=\"themeToggle\" aria-label=\"Toggle theme\">Dark\u003c/button>\n      \u003c/div>\n    \u003c/header>\n  \u003cdiv class=\"wrap\">\n\n    \u003cform id=\"callForm\" novalidate>\n      \u003cfieldset>\n        \u003clegend>Call Details\u003c/legend>\n        \u003cdiv class=\"grid g3\">\n          \u003clabel>\n            \u003cspan class=\"srOnly\">Inbound/Outbound\u003c/span>\n            \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Inbound/Outbound\">\n              \u003cbutton class=\"segBtn\" type=\"button\" data-dir=\"Inbound\" aria-pressed=\"false\">Inbound\u003c/button>\n              \u003cbutton class=\"segBtn\" type=\"button\" data-dir=\"Outbound\" aria-pressed=\"false\">Outbound\u003c/button>\n              \u003cbutton class=\"segBtn\" type=\"button\" data-dir=\"Unanswered\" aria-pressed=\"false\">Unanswered\u003c/button>\n            \u003c/div>\n            \u003cinput type=\"hidden\" name=\"direction\" />\n          \u003c/label>\n\n          \u003clabel>Date/Time\n            \u003cdiv class=\"withIcon\">\n              \u003cinput name=\"dateTime\" type=\"text\" inputmode=\"numeric\" />\n              \u003cbutton type=\"button\" class=\"iconBtn\" id=\"nowBtn\" aria-label=\"Insert current date/time\" title=\"Insert current date/time\">\n                \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n                  \u003cpath d=\"M12 8v5l3 2\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n                  \u003cpath d=\"M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z\" stroke=\"currentColor\" stroke-width=\"2\"/>\n                \u003c/svg>\n              \u003c/button>\n              \u003cbutton type=\"button\" class=\"iconBtn\" id=\"timezonesBtn\" aria-label=\"Check Australian timezones\" title=\"Check Australian timezones\" aria-haspopup=\"dialog\">\n                \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n                  \u003ccircle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.8\"/>\n                  \u003cpath d=\"M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9Z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/>\n                \u003c/svg>\n              \u003c/button>\n            \u003c/div>\n          \u003c/label>\n\n          \u003clabel>Case ID\n            \u003cinput name=\"caseId\" type=\"text\" />\n          \u003c/label>\n\n          \u003clabel id=\"numberDialedWrap\" hidden>Number Dialed\n            \u003cinput name=\"numberDialed\" type=\"tel\" />\n          \u003c/label>\n\n          \u003clabel>Account name\n            \u003cinput name=\"accountName\" type=\"text\" />\n          \u003c/label>\n\n          \u003clabel id=\"spokeToWrap\">Spoke to\n            \u003cinput name=\"spokeTo\" type=\"text\" />\n          \u003c/label>\n\n          \u003clabel id=\"poroCompletedWrap\">PORO completed\n            \u003cselect name=\"poroCompleted\" id=\"poroCompleted\">\n              \u003coption value=\"\">\u003c/option>\n              \u003coption value=\"Yes\">Yes\u003c/option>\n              \u003coption value=\"No\">No\u003c/option>\n            \u003c/select>\n          \u003c/label>\n\n          \u003clabel id=\"privacyStatementProvidedWrap\">Privacy statement provided\n            \u003cselect name=\"privacyStatementProvided\" id=\"privacyStatementProvided\">\n              \u003coption value=\"\">\u003c/option>\n              \u003coption value=\"Yes\">Yes\u003c/option>\n              \u003coption value=\"No\">No\u003c/option>\n              \u003coption value=\"NA\">NA\u003c/option>\n            \u003c/select>\n          \u003c/label>\n\n          \u003clabel id=\"phoneRecordingStatementProvidedWrap\">Phone recording statement provided\n            \u003cselect name=\"phoneRecordingStatementProvided\" id=\"phoneRecordingStatementProvided\">\n              \u003coption value=\"\">\u003c/option>\n              \u003coption value=\"Yes\">Yes\u003c/option>\n              \u003coption value=\"No\">No\u003c/option>\n              \u003coption value=\"NA\">NA\u003c/option>\n            \u003c/select>\n          \u003c/label>\n\n          \u003clabel id=\"emailSecurityWarningProvidedWrap\">Email security warning provided\n            \u003cselect name=\"emailSecurityWarningProvided\" id=\"emailSecurityWarningProvided\">\n              \u003coption value=\"\">\u003c/option>\n              \u003coption value=\"Yes\">Yes\u003c/option>\n              \u003coption value=\"No\">No\u003c/option>\n              \u003coption value=\"NA\">NA\u003c/option>\n            \u003c/select>\n          \u003c/label>\n        \u003c/div>\n      \u003c/fieldset>\n\n      \u003cfieldset id=\"poroFieldset\" hidden>\n        \u003clegend>PORO\u003c/legend>\n        \u003cdiv class=\"grid g2\">\n          \u003clabel>Standard PORO\n            \u003cdiv class=\"ms\" data-ms=\"poroStandardSel\" id=\"msStandard\">\n              \u003cbutton type=\"button\" class=\"msToggle\">Select options\u003c/button>\n              \u003cdiv class=\"msMenu\" role=\"listbox\" aria-multiselectable=\"true\">\n                \u003cdiv class=\"msOpt\" data-value=\"Name\">Name\u003c/div>\n                \u003cdiv class=\"msOpt\" data-value=\"DOB\">DOB\u003c/div>\n                \u003cdiv class=\"msOpt\" data-va ASH\">dd/mm/yyyy\u003c/option>\n              \u003coption value=\"YMD_SLASH\">yyyy/mm/dd\u003c/option>\n              \u003coption value=\"DMY_DASH\">dd-mm-yyyy\u003c/option>\n              \u003coption value=\"YMD_DASH\">yyyy-mm-dd\u003c/option>\n            \u003c/select>\n          \u003c/label>\n\u003clabel>\u003cspan class=\"settingCaption\">Time format \u003cspan class=\"settingHelp\" tabindex=\"0\" role=\"img\" aria-label=\"Use 12-hour or 24-hour time when inserting the timestamp.\" data-tooltip=\"Use 12-hour or 24-hour time when inserting the timestamp.\">?\u003c/span>\u003c/span>\n\u003cselect id=\"dtTimeFmt\">\n              \u003coption value=\"24\">24 hour\u003c/option>\n              \u003coption value=\"12\">12 hour (AM/PM)\u003c/option>\n            \u003c/select>\n          \u003c/label>\n\u003clabel>\u003cspan class=\"settingCaption\">Order \u003cspan class=\"settingHelp\" tabindex=\"0\" role=\"img\" aria-label=\"Choose whether the date or time comes first.\" data-tooltip=\"Choose whether the date or time comes first.\">?\u003c/span>\u003c/span>\n\u003cselect id=\"dtOrder\">\n              \u003coption value=\"DATE_TIME\">Date then time\u003c/option>\n              \u003coption value=\"TIME_DATE\">Time then date\u003c/option>\n            \u003c/select>\n          \u003c/label>\n\u003clabel>\u003cspan class=\"settingCaption\">Between date &amp; time \u003cspan class=\"settingHelp\" tabindex=\"0\" role=\"img\" aria-label=\"Text placed between the date and time.\" data-tooltip=\"Text placed between the date and time.\">?\u003c/span>\u003c/span>\n\u003cinput id=\"dtJoiner\" type=\"text\" value=\"  -  \" />\n          \u003c/label>\n\u003clabel class=\"settingWide\">\u003cspan class=\"settingCaption\">Preview \u003cspan class=\"settingHelp\" tabindex=\"0\" role=\"img\" aria-label=\"Example timestamp using the options above.\" data-tooltip=\"Example timestamp using the options above.\">?\u003c/span>\u003c/span>\n\u003cinput id=\"dtPreview\" type=\"text\" readonly />\n          \u003c/label>\n\u003c/div>\u003c/section>\n\n        \u003cdiv style=\"display:flex; gap:10px; justify-content:flex-end; margin-top:12px;\">\n          \u003cbutton type=\"button\" class=\"ghost\" id=\"dtReset\" title=\"Restore all settings to their defaults.\">Reset settings\u003c/button>\n          \u003cbutton type=\"button\" id=\"dtSave\">Save\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"modalOverlay\" id=\"scriptOverlay\" hidden>\n    \u003cdiv class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"scriptTitle\" tabindex=\"-1\">\n      \u003cdiv class=\"modalHeader\">\u003cstrong id=\"scriptTitle\">\u003c/strong>\u003cbutton type=\"button\" class=\"ghost\" id=\"closeScript\">Close\u003c/button>\u003c/div>\n      \u003cdiv class=\"modalBody scriptText\" id=\"scriptBody\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003cscript>\n    function formatDateTime(d, s){\n      const pad = (n)=> String(n).padStart(2,\"0\");\n      const dd = pad(d.getDate());\n      const mm = pad(d.getMonth()+1);\n      const yyyy = String(d.getFullYear());\n      const hh24 = d.getHours();\n      const mi = pad(d.getMinutes());\n\n      let datePart = \"\";\n      if (s.dateFmt === \"DMY_SLASH\") datePart = `${dd}/${mm}/${yyyy}`;\n      else if (s.dateFmt === \"YMD_SLASH\") datePart = `${yyyy}/${mm}/${dd}`;\n      else if (s.dateFmt === \"DMY_DASH\") datePart = `${dd}-${mm}-${yyyy}`;\n      else datePart = `${yyyy}-${mm}-${dd}`;\n\n      let timePart = \"\";\n      if (s.timeFmt === \"12\"){\n        let h = hh24 % 12;\n        if (h === 0) h = 12;\n        const ampm = hh24 \u003c 12 ? \"AM\" : \"PM\";\n        timePart = `${pad(h)}:${mi} ${ampm}`;\n      }else{\n        timePart = `${pad(hh24)}:${mi}`;\n      }\n\n      return (s.order === \"TIME_DATE\") ? `${timePart}${s.joiner}${datePart}` : `${datePart}${s.joiner}${timePart}`;\n    }\n\nconst $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst LS_DT_KEY='callNoteBuilder.dateTimeFormat', LS_THEME_KEY='callNoteBuilder.theme';\nconst DEFAULT_DT={dateFmt:'DMY_SLASH',timeFmt:'12',joiner:'  -  ',order:'TIME_DATE',signoff:'',pin:'',callStart:'08:30',callEnd:'16:30',furtherAction:'Yes',reason:'Yes',simplePoro:'Yes',previewNote:'No',version:2};\nfunction getDTSettings(){try{const saved=JSON.parse(localStorage.getItem(LS_DT_KEY)||'{}');if(saved.version!==2){saved.furtherAction=saved.noFurtherAction==='Yes'?'No':'Yes';saved.reason=saved.noReason==='Yes'?'No':'Yes';saved.simplePoro='Yes';}return {...DEFAULT_DT,...saved,version:2};}catch{return {...DEFAULT_DT};}}\nlet settings=getDTSettings();\nfunction persist(){try{localStorage.setItem(LS_DT_KEY,JSON.stringify(settings));}catch{}}\nfunction v(name){return ($(`[name=\"${name}\"]`)?.value||'').trim();}\nfunction setVal(name,value){$(`[name=\"${name}\"]`).value=value;}\nconst unansweredReason='Attempted Call - Left Voicemail';\nlet priorReason='', lastDirection='';\nfunction syncVisibility(){const dir=v('direction'),unanswered=dir==='Unanswered',inbound=dir==='Inbound';\nfor(const name of ['spokeTo','poroCompleted','emailSecurityWarningProvided'])$('#'+name+'Wrap').hidden=unanswered;\nfor(const name of ['privacyStatementProvided','phoneRecordingStatementProvided'])$('#'+name+'Wrap').hidden=unanswered||inbound;\n$('#numberDialedWrap').hidden=dir!=='Outbound'&&!unanswered;\n$('#poroFieldset').hidden=unanswered||v('poroCompleted')!=='Yes'||settings.simplePoro==='Yes';\n$('#reasonForCallWrap').hidden=settings.reason!=='Yes';$('#furtherActionWrap').hidden=settings.furtherAction!=='Yes';\n$('#discussedWrap').hidden=unanswered;$('#notePreview').hidden=settings.previewNote!=='Yes';\nbuildNote();}\nfunction changeDirection(dir){if(dir==='Unanswered'&&lastDirection!==dir){priorReason=v('reasonForCall');setVal('reasonForCall',unansweredReason);}else if(lastDirection==='Unanswered'&&dir!=='Unanswered'&&v('reasonForCall')===unansweredReason){setVal('reasonForCall',priorReason);}\nsetVal('direction',dir);lastDirection=dir;$$('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dir===dir)));syncVisibility();}\nfunction buildNote(){const dir=v('direction'),unanswered=dir==='Unanswered',inbound=dir==='Inbound';let head=[];if(dir)head.push(dir);\nfunction line(label,name){const val=v(name);if(val)head.push(label+': '+val);}\nline('Date/Time','dateTime');if(dir==='Outbound'||unanswered)line('Number Dialed','numberDialed');line('Account name','accountName');\nif(!unanswered){line('Spoke to','spokeTo');let poro=v('poroCompleted');if(poro==='Yes'&&settings.simplePoro!=='Yes'&&(v('poroExtensiveSel')||v('poroExtensiveTxt')))poro='Extensive';if(poro)head.push('PORO completed: '+poro);\nif(!inbound){line('Privacy statement provided','privacyStatementProvided');line('Phone recording statement provided','phoneRecordingStatementProvided');}line('Email security warning provided','emailSecurityWarningProvided');}\nline('Case ID','caseId');const blocks=head.length?[head.join('\\n')]:[];\nif(!unanswered&&v('poroCompleted')==='Yes'&&settings.simplePoro!=='Yes'){let proof=[];for(const [label,sel,txt] of [['Standard PORO','poroStandardSel','poroStandardTxt'],['Extensive PORO','poroExtensiveSel','poroExtensiveTxt']]){const val=[v(sel),v(txt)].filter(Boolean).join(' - ');if(val)proof.push(label+': '+val);}if(proof.length)blocks.push('PORO:\\n'+proof.join('\\n'));}\nfunction section(label,name,enabled){if(enabled&&v(name))blocks.push(label+':\\n'+v(name));}\nsection('Reason for call','reasonForCall',settings.reason==='Yes');section('Discussed','discussed',!unanswered);section('Further Action','furtherAction',settings.furtherAction==='Yes');\nif(settings.signoff.trim())blocks.push(settings.signoff.trim());const note=blocks.join('\\n\\n');$('#preview').textContent=note;return note;}\nfunction setTheme(theme){document.body.dataset.theme=theme;$('#themeToggle').textContent=theme==='dark'?'Light':'Dark';try{localStorage.setItem(LS_THEME_KEY,theme);}catch{}}\ntry{setTheme(localStorage.getItem(LS_THEME_KEY)||'light');}catch{setTheme('light');}\n$('#themeToggle').onclick=()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark');\n$$('[data-dir]').forEach(b=>b.onclick=()=>changeDirection(b.dataset.dir));\n$$('.ms').forEach(ms=>{const toggle=$('.msToggle',ms);toggle.onclick=()=>{const open=ms.classList.contains('open');$$('.ms').forEach(m=>m.classList.remove('open'));ms.classList.toggle('open',!open);};$$('.msOpt',ms).forEach(opt=>{opt.tabIndex=0;opt.setAttribute('role','option');opt.setAttribute('aria-selected','false');function select(){opt.classList.toggle('selected');opt.setAttribute('aria-selected',String(opt.classList.contains('selected')));const vals=$$('.selected',ms).map(o=>o.dataset.value).join(', ');setVal(ms.dataset.ms,vals);toggle.textContent=vals||'Select options';buildNote();}opt.onclick=select;opt.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();select();}};});});\ndocument.addEventListener('click',e=>$$('.ms').forEach(ms=>{if(!ms.contains(e.target))ms.classList.remove('open');}));\n$('#callForm').addEventListener('input',syncVisibility);$('#callForm').addEventListener('change',syncVisibility);$('#callForm').addEventListener('submit',e=>e.preventDefault());\n$('#nowBtn').onclick=()=>{setVal('dateTime',formatDateTime(new Date(),settings));buildNote();};\n$('#copyBtn').onclick=async()=>{const note=buildNote();let ok=false;try{await navigator.clipboard.writeText(note);ok=true;}catch{const ta=document.createElement('textarea');ta.value=note;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();try{ok=document.execCommand('copy');}catch{}ta.remove();}$('#status').textContent=ok?'Copied.':'Clipboard copy failed (browser blocked it).';setTimeout(()=>$('#status').textContent='',2500);};\n$('#callForm').addEventListener('reset',()=>setTimeout(()=>{lastDirection='';priorReason='';setVal('direction','  Money and Lost Members Act 1999\u003c/em>, and the \u003cem>Superannuation Industry Supervision Act 1993\u003c/em> authorise us to collect other personal information about you.\u003c/p>\n\u003cp>We need this information to help us administer taxation and superannuation laws. If the information is not collected we will not be able to assist you with arrangements about your tax obligations, and more action may be taken by the ATO to enforce your obligations without further warning.\u003c/p>\n\u003cp>Taxation law authorises us to disclose information about you to other agencies – for example, benefit payment agencies such as the Services Australia (SA), law enforcement agencies such as state and federal police, and other agencies such as the Australian Bureau of Statistics.\u003c/p>\n\u003cp>The ATO also provides taxpayer information to treaty partners overseas under international tax agreements with many other countries. Information about our treaties is on our website.\u003c/p>\n\u003cp>If you have an Australian business number, we collect information about you for the purposes of the \u003cem>New Tax System Australian Business Number Act 1999\u003c/em> and may use your information to update your details on the Australian Business Register. Selected information from the Australian Business Register is made publicly available and some is passed to a wide range of government agencies, including Commonwealth, state and local government agencies. You can find details of the agencies regularly receiving information from the Australian Business Register at \u003ca href=\"http://www.abr.gov.au/\" target=\"_blank\" rel=\"noopener noreferrer\">www.abr.gov.au\u003c/a>\u003c/p>\n\u003cp>The ATO's privacy policy is also on our website. The policy contains important information about your privacy, including information about how you can access and seek correction of information we hold about you, how you may complain about a breach of the Australian Privacy Principles and how the ATO will deal with any privacy complaint.\u003c/p>`}\n};\n$$('[data-script]').forEach(b=>b.onclick=()=>{if(b.dataset.script==='voicemail'){$('#scriptTitle').textContent='Voicemail Message';$('#scriptBody').replaceChildren();for(const text of [`Hello, this is ${settings.signoff||'[Name]'} and I’m calling from the Australian Taxation Office.`,`Please call me back on 1300 650 286 and enter four digit pin ${settings.pin||'[PIN]'} to come through to me.`]){const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=text;p.append(strong);$('#scriptBody').append(p);}}else{const script=scripts[b.dataset.script];$('#scriptTitle').textContent=script.title;$('#scriptBody').innerHTML=script.html;}openModal('scriptOverlay');});\n$('#closeScript').onclick=()=>closeModal('scriptOverlay');\nsyncVisibility();\n\n\u003c/script>\n\u003cscript>\nfunction openAustralianTimes() {\n  'use strict';\n  const ID = 'au_time_popup_v5';\n  if (document.getElementById(ID)) return;\n  const HOLIDAYS = {\"2026\":{\"ACT\":{\"2026-01-01\":[[\"New Year's Day\",0,0,1440]],\"2026-01-26\":[[\"Australia Day\",0,0,1440]],\"2026-03-09\":[[\"Canberra Day\",0,0,1440]],\"2026-04-03\":[[\"Good Friday\",0,0,1440]],\"2026-04-04\":[[\"Easter Saturday – the day after Good Friday\",0,0,1440]],\"2026-04-05\":[[\"Easter Sunday\",0,0,1440]],\"2026-04-06\":[[\"Easter Monday\",0,0,1440]],\"2026-04-25\":[[\"Anzac Day\",0,0,1440]],\"2026-04-27\":[[\"Additional public holiday for Anzac Day\",0,0,1440]],\"2026-06-01\":[[\"Reconciliation Day\",0,0,1440]],\"2026-06-08\":[[\"King’s Birthday\",0,0,1440]],\"2026-10-05\":[[\"Labour Day\",0,0,1440]],\"2026-12-25\":[[\"Christmas Day\",0,0,1440]],\"2026-12-26\":[[\"Boxing Day\",0,0,1440]],\"2026-12-28\":[[\"Additional public holiday for Boxing Day\",0,0,1440]]},\"NSW\":{\"2026-01-01\":[[\"New Year's Day\",0,0,1440]],\"2026-01-26\":[[\"Australia Day\",0,0,1440]],\"2026-04-03\":[[\"Good Friday\",0,0,1440]],\"2026-04-04\":[[\"Easter Saturday\",0,0,1 th,initial-scale=1\">\u003ctitle>GST Calculator\u003c/title>\u003cstyle>\n:root{color-scheme:light;--bg:#f2f5f7;--panel:#fff;--panel-2:#f8fafc;--text:#23354b;--muted:#5d7084;--border:#dce4ec;--border-2:#ced8df;--accent:#006b98;--soft:#e6f2f7;--brand:#153956}\nbody[data-theme=dark]{color-scheme:dark;--bg:#101d2a;--panel:#192a3b;--panel-2:#213447;--text:#e3edf5;--muted:#a2b6c8;--border:#34465a;--border-2:#485e74;--accent:#65bfe8;--soft:#203d51;--brand:#e3edf5}\n*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--panel);color:var(--text);font-weight:600}button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.pageHeader{display:flex;align-items:center;gap:12px;padding:18px 24px;background:var(--panel);border-top:5px solid #153956;border-bottom:1px solid var(--border)}body[data-theme=dark] .pageHeader{border-top-color:#65bfe8}h1{margin:0;color:var(--brand);font-size:21px;letter-spacing:-.7px;font-weight:750;line-height:1.3}h1 span{color:var(--accent)}.modeToggle{margin-left:auto;border-radius:999px;font-size:12px;padding:6px 10px;height:32px}.wrap{max-width:1000px;padding:24px;margin:0 auto}.grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.3fr);gap:20px;align-items:start}fieldset{margin:0;min-width:0;border:1px solid var(--border);border-radius:12px;padding:20px;background:var(--panel)}legend{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:0 8px}label{display:grid;gap:8px;font-size:12px;font-weight:600}input{width:100%;min-width:0;border:1px solid var(--border-2);border-radius:7px;background:var(--panel);color:var(--text);padding:10px 11px;height:42px;font-siz tton type=\"button\" class=\"copy\" data-copy=\"netGross\" aria-label=\"Copy gross to net\">Copy\u003c/button>\u003c/div>\u003cdiv class=\"result\">\u003cdiv class=\"result-info\">\u003cdiv class=\"label\">Net to gross\u003c/div>\u003coutput class=\"value\" data-out=\"grossNet\" for=\"amount\">$0.00\u003c/output>\u003c/div>\u003cbutton type=\"button\" class=\"copy\" data-copy=\"grossNet\" aria-label=\"Copy net to gross\">Copy\u003c/button>\u003c/div>\u003cdiv class=\"result\">\u003cdiv class=\"result-info\">\u003cdiv class=\"label\">GST included in gross\u003c/div>\u003coutput class=\"value\" data-out=\"gst\" for=\"amount\">$0.00\u003c/output>\u003c/div>\u003cbutton type=\"button\" class=\"copy\" data-copy=\"gst\" aria-label=\"Copy GST included in gross\">Copy\u003c/button>\u003c/div>\u003c/fieldset>\u003c/div>\u003cdiv class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003c/main>\u003cscript>\n'use strict';\nconst $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));\nfunction calculate(raw){const cleaned=String(raw??'').replace(/[\\s,$]/g,'');const x=cleaned===''?0:Number(cleaned);const result={netGross:x/1.1,grossNet:x*1.1,gst:x/11};return Object.values(result).every(Number.isFinite)?result:null;}\nfunction formatMoney(n){return (n\u003c0?'-':'')+'$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}\nfunction compute(){const result=calculate($('#amount').value);$('#amount').setAttribute('aria-invalid',String(!result));$('#amountError').hidden=!!result;for(const output of $$('[data-out]'))output.textContent=result?formatMoney(result[output.dataset.out]):'';for(const button of $$('[data-copy]'))button.disabled=!result;$('#status').textContent='';}\nlet statusTimer;function status(text){clearTimeout(statusTimer);$('#status').textContent=text;statusTimer=setTimeout(()=>$('#status').textContent='',1800);}\nasync function copyText(text){try{await navigator.clipboard.writeText(t
